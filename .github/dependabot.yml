version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # The files in app/public/models must match this package. Update both by hand, then run the hash check.
      - dependency-name: "@mediapipe/tasks-vision"
      # typescript-eslint does not support TypeScript 7 yet, and one test uses the TypeScript 6 compiler API.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: "development"
